name: Build and test Corte OS

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corte-os-iso-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mtools dosfstools xorriso squashfs-tools \
            qemu-system-x86 qemu-utils ovmf \
            python3 ca-certificates curl file

      - name: Build ISO in Debian bookworm container
        run: |
          docker build -t corte-os-builder -f build/Dockerfile .
          docker run --rm --privileged -v "$PWD:/work" corte-os-builder /work/build/build.sh

      - name: Verify checksums
        run: |
          ls -lh dist/
          cd dist
          sha256sum -c ./*.iso.sha256
          sha512sum -c ./*.iso.sha512

      - name: Clean build tree
        run: sudo rm -rf build/chroot build/binary build/cache build/bootstrap

      - name: Verify ISO contents and licensing
        run: |
          ISO="dist/CorteOS-$(cat VERSION)-amd64.iso"
          rm -f /tmp/corte-fs.squashfs
          xorriso -osirrox on -indev "$ISO" -extract /live/filesystem.squashfs /tmp/corte-fs.squashfs >/dev/null 2>&1
          test -f /tmp/corte-fs.squashfs
          unsquashfs -cat /tmp/corte-fs.squashfs usr/share/doc/corte-os/SOURCES.md > /tmp/corte-SOURCES.md
          grep -q "Fuentes y licencias de Corte OS" /tmp/corte-SOURCES.md
          unsquashfs -cat /tmp/corte-fs.squashfs etc/corte/developer | grep -qx "gonzita"
          unsquashfs -cat /tmp/corte-fs.squashfs usr/lib/os-release | grep -q 'DEVELOPER="gonzita"'
          unsquashfs -cat /tmp/corte-fs.squashfs var/lib/dpkg/status > /tmp/corte-dpkg-status
          if awk '/^Package: /{p=$2} /^Status: install ok installed/{print p}' /tmp/corte-dpkg-status | grep -qxE 'intel-microcode|amd64-microcode'; then
            echo "ERROR: la ISO contiene microc?digo non-free"
            exit 1
          fi
          echo "ISO verificada: SOURCES.md, desarrollador gonzita y sin microc?digo non-free."

      - name: Upload ISO (pre-test)
        uses: actions/upload-artifact@v4
        with:
          name: corte-os-iso-pretest
          path: |
            dist/CorteOS-*.iso
            dist/CorteOS-*.sha256
            dist/CorteOS-*.sha512
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Inspect ISO boot configuration
        run: |
          ISO="dist/CorteOS-$(cat VERSION)-amd64.iso"
          rm -rf /tmp/isolinux /tmp/grub /tmp/efi
          xorriso -osirrox on -indev "$ISO" -extract /isolinux /tmp/isolinux >/dev/null 2>&1 || true
          xorriso -osirrox on -indev "$ISO" -extract /boot/grub /tmp/grub >/dev/null 2>&1 || true
          xorriso -osirrox on -indev "$ISO" -extract /EFI /tmp/efi >/dev/null 2>&1 || true
          find /tmp/isolinux /tmp/grub /tmp/efi -maxdepth 3 -type f -print 2>/dev/null || true
          echo "=== isolinux.cfg ==="
          cat /tmp/isolinux/isolinux.cfg 2>/dev/null || true
          echo "=== syslinux.cfg ==="
          cat /tmp/isolinux/syslinux.cfg 2>/dev/null || true
          echo "=== grub.cfg ==="
          cat /tmp/grub/grub.cfg 2>/dev/null || true
          echo "=== live files ==="
          xorriso -indev "$ISO" -ls /live 2>/dev/null || true

      - name: Direct kernel boot diagnostic
        run: |
          ISO="dist/CorteOS-$(cat VERSION)-amd64.iso"
          mkdir -p /tmp/corte-live
          xorriso -osirrox on -indev "$ISO" \
            -extract /live/vmlinuz /tmp/corte-live/vmlinuz \
            -extract /live/initrd.img /tmp/corte-live/initrd.img >/dev/null 2>&1
          qemu-system-x86_64 \
            -m 2048 -smp 2 -machine accel=tcg -vga std \
            -display none -serial stdio -monitor none -no-reboot \
            -netdev user,id=net0 -device e1000,netdev=net0 \
            -drive "file=$ISO,media=cdrom,readonly=on" \
            -kernel /tmp/corte-live/vmlinuz \
            -initrd /tmp/corte-live/initrd.img \
            -append "boot=live components live-media=/dev/sr0 console=ttyS0,115200n8 username=corte hostname=corte-os locales=es_ES.UTF-8 keyboard-layouts=es timezone=Europe/Madrid" \
            > /tmp/corte-direct.log 2>&1 &
          QPID=$!
          OK=0
          for _ in $(seq 1 450); do
            if grep -q "CORTE_LIVE_READY" /tmp/corte-direct.log 2>/dev/null; then
              OK=1
              break
            fi
            if ! kill -0 "$QPID" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          kill "$QPID" 2>/dev/null || true
          wait "$QPID" 2>/dev/null || true
          tail -n 250 /tmp/corte-direct.log || true
          if [ "$OK" -ne 1 ]; then
            echo "No se detectó CORTE_LIVE_READY en el arranque directo del kernel."
            exit 1
          fi

      - name: Boot test (BIOS)
        run: bash scripts/ci/boot-test.sh dist/CorteOS-$(cat VERSION)-amd64.iso

      - name: Install test (BIOS, QEMU disk)
        run: bash scripts/ci/install-test.sh dist/CorteOS-$(cat VERSION)-amd64.iso

      - name: Generate release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          bash scripts/ci/make-release-json.sh \
            "dist/CorteOS-$(cat VERSION)-amd64.iso" \
            "${GITHUB_REF_NAME}" \
            "web/corte-os/release.json"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: corte-os-iso
          path: |
            dist/CorteOS-*.iso
            dist/CorteOS-*.sha256
            dist/CorteOS-*.sha512
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload release metadata artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: corte-os-release-json
          path: web/corte-os/release.json
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Corte OS ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/CorteOS-*.iso
            dist/CorteOS-*.sha256
            dist/CorteOS-*.sha512
            web/corte-os/release.json
